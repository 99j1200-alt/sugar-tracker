name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SugarTracker.xcodeproj \
            -scheme SugarTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SugarTracker.app Payload/
          zip -qry SugarTracker.ipa Payload
          ls -lh SugarTracker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SugarTracker-ipa
          path: SugarTracker.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SugarTracker.ipa \
            --target "${{ github.sha }}" \
            --title "SugarTracker (latest build)" \
            --notes "Unsigned IPA. Sign and install it with ESign."
